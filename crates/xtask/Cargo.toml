[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1.11"
icns = { version = "0.5.0", default-features = false, features = ["pngio"] }
ico = "0.6.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
resvg = { version = "0.49.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.1"
