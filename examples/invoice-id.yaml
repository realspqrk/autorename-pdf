# Business invoices with printed total AND printed invoice number.
# Filename: 20260906 ACME AP 12,13 12345.pdf
# `description` stays the printed total; invoice_id is empty when absent.
# The overlay merges into the built-in business profile: do not repeat its fields.
# Every key not listed here uses its default (see config.yaml.example).
config_version: 4

ai:
  provider: openai
  api_key: "${OPENAI_API_KEY}"

company:
  name: "Your Company Ltd"

profiles:
  business:
    fields:
      invoice_id:
        description: "Copy the printed invoice number exactly, without an Invoice or Rechnung label. Empty if absent or the document is not an invoice."
    template: "{document_date} {company_name} {document_type} {description} {invoice_id}"
    truncate_field: description   # unchanged: the total is shortened first, never the number
