# Academic papers, preprints, theses.
# Filename: 20260101 Smith Nature Attention Is All You Need.pdf
#   date · first author · venue (omitted when empty) · title
# Year-only dates become 01.01 of that year. No name matching by default; to
# unify venue spellings add `profiles: {academic: {harmonize_field: journal_name}}`
# (learned into name-lists/journal_name.yaml beside the config).
# One-run alternative without this file: autorename-pdf rename --profile academic paper.pdf
# Every key not listed here uses its default (see config.yaml.example).
config_version: 4

ai:
  provider: openai
  api_key: "${OPENAI_API_KEY}"

profile: academic
