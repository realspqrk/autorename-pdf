# German invoice codes: ER = Eingangsrechnung, AR = Ausgangsrechnung.
# Filename: 20260906 ACME ER 12,13.pdf
# Common German bookkeeping abbreviations, not a DATEV filename standard.
# Every key not listed here uses its default (see config.yaml.example).
config_version: 4

ai:
  provider: openai
  api_key: "${OPENAI_API_KEY}"

pdf:
  incoming_invoice: ER          # default AP (Accounts Payable)
  outgoing_invoice: AR          # same token as the default; here Ausgangsrechnung

company:
  name: "Meine Firma GmbH"      # your company, so ER and AR can be told apart

output:
  language: German              # non-invoice types: Brief, Vertrag, ...
