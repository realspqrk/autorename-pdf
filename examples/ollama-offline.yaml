# Fully local: Ollama LLM + built-in OCR. No API key; no cloud request is
# allowed (anything non-local is an error, exit 3).
# Filename: 20260906 ACME AP EUR 12.13.pdf (business profile)
#
# Easiest: `autorename-pdf setup --offline --ollama-model <model> --company <you>`
# writes the same settings. Before going offline:
#   ollama pull gemma4               # vision-capable; CPU-only hosts: gemma4:e2b
#                                    # (then also set ai.model: gemma4:e2b below)
#   autorename-pdf models fetch      # OCR models (~40 MB); offline blocks downloads.
#                                    # Air-gapped: `autorename-pdf models import <copied models dir>`
# Every key not listed here uses its default (see config.yaml.example).
config_version: 4

privacy: offline

ai:
  provider: ollama
  model: gemma4
  base_url: http://localhost:11434   # localhost or a LAN address only

pdf:
  ocr: auto                     # scans: local OCR first
  vision: auto                  # still poor: page images to the local model

harmonization:
  decider: ai                   # ambiguous company names: asks the local model
