# Scans read by a cloud vision model, without local OCR.
# Filename: 20260906 ACME AP 12,13.pdf
# The text layer is still read first; page images are sent whenever vision
# is `true` (set `auto` to send them only for poor text layers).
# Every key not listed here uses its default (see config.yaml.example).
config_version: 4

ai:
  provider: gemini              # vision-capable; openai, anthropic and xai work too
  model: gemini-3.8-flash       # must accept images
  api_key: "${GEMINI_API_KEY}"

pdf:
  ocr: false                    # no local OCR models needed
  vision: true                  # always send page images
